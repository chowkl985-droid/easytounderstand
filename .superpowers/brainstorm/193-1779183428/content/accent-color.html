<h2>極簡黑白 + 一個強調色</h2>
<p class="subtitle">左欄輸入區用白底/黑字，強調色用在按鈕和標記。選一個感覺對的。</p>

<div class="options">
  <div class="option" data-choice="blue" onclick="toggleSelect(this)">
    <div class="letter" style="background:#0071e3;color:#fff">A</div>
    <div class="content">
      <h3>蘋果藍</h3>
      <p>專業、可靠、科技感。像 Apple 官網按鈕的藍色。</p>
    </div>
  </div>
  <div class="option" data-choice="green" onclick="toggleSelect(this)">
    <div class="letter" style="background:#34c759;color:#fff">B</div>
    <div class="content">
      <h3>清新綠</h3>
      <p>自然、柔和、學習感。適合「理解/教育」主題。</p>
    </div>
  </div>
  <div class="option" data-choice="orange" onclick="toggleSelect(this)">
    <div class="letter" style="background:#ff6b35;color:#fff">C</div>
    <div class="content">
      <h3>溫暖橘</h3>
      <p>親切、活潑、香港街市感覺。符合「朋友聊天」語氣。</p>
    </div>
  </div>
  <div class="option" data-choice="purple" onclick="toggleSelect(this)">
    <div class="letter" style="background:#8b5cf6;color:#fff">D</div>
    <div class="content">
      <h3>創造紫</h3>
      <p>創意、智慧、獨特。和 GentleReview 區分開但有相似質感。</p>
    </div>
  </div>
</div>
