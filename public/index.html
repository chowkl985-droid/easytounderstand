<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講人話 — 複雜文章變簡單白話</title>
  <link rel="icon" href="icon128.png">
  <style>
/* === Reset & Variables === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fef9f0;
  --bg-alt: #f5ead5;
  --surface: rgba(255,255,255,0.75);
  --surface-hover: rgba(255,255,255,0.92);
  --border: rgba(0,0,0,0.08);
  --text: #1a1a1a;
  --text-secondary: #6b6b6b;
  --accent: #0cf6b7;
  --accent-hover: #0ae0a5;
  --accent-light: rgba(12,246,183,0.10);
  --accent-border: rgba(12,246,183,0.30);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #1a1a1a;
  --bg-alt: #121212;
  --surface: rgba(255,255,255,0.05);
  --surface-hover: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.10);
  --text: #f0f0f0;
  --text-secondary: #999;
  --accent-light: rgba(12,246,183,0.15);
  --accent-border: rgba(12,246,183,0.40);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  transition: background var(--transition), color var(--transition);
  min-height: 100vh;
}

/* === Nav === */
.nav-bar {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.nav-inner { max-width: 1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 24px; }
.nav-logo { font-weight:700; font-size:1.1rem; display:flex; align-items:center; gap:8px; }
	.nav-icon { width:28px; height:28px; border-radius:6px; }
.nav-actions { display:flex; gap:8px; }
.icon-btn {
  background: var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:6px 10px; cursor:pointer; font-size:1.1rem; color:var(--text);
  transition: all var(--transition);
}
.icon-btn:hover { background: var(--surface-hover); }
	.lang-btn {
	  background: var(--surface); border:1px solid var(--border); border-radius:6px;
	  padding:5px 10px; cursor:pointer; font-size:0.82rem; color:var(--text-secondary);
	  transition: all var(--transition); font-weight:500;
	}
	.lang-btn:hover { border-color:var(--accent); color:var(--accent); }
	.lang-btn.active { background:var(--accent); color:#05262f; border-color:var(--accent); }
	.lang-select { display:none; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:0.82rem; color:var(--text); font-family:inherit; cursor:pointer; }
	.lang-tooltip { display:none; position:absolute; top:100%; right:0; margin-top:6px; background:var(--accent); color:#05262f; font-size:0.72rem; padding:4px 10px; border-radius:6px; white-space:nowrap; }
	.lang-tooltip.show { display:block; }
	.nav-actions { position:relative; }
	.welcome-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:300; background:var(--accent); color:#05262f; padding:14px 24px; border-radius:12px; font-size:0.9rem; font-weight:600; box-shadow:0 8px 32px rgba(0,0,0,0.15); opacity:0; transition:opacity 0.4s,transform 0.4s; pointer-events:none; max-width:90vw; text-align:center; }
	.welcome-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* === Main Layout === */
.main-container { display:flex; gap:16px; max-width:1400px; margin:16px auto; padding:0 16px; min-height:calc(100vh - 80px); }
.panel { flex:1; display:flex; flex-direction:column; }
.panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.panel-header h2 { font-size:1rem; font-weight:700; }
.panel-header-actions { display:flex; gap:6px; }

/* === Buttons === */
.btn-primary {
  background:var(--accent); color:#05262f; border:none; border-radius:50px;
  padding:10px 22px; font-weight:600; font-size:0.9rem; cursor:pointer;
  transition: all var(--transition);
}
.btn-primary:hover { background:var(--accent-hover); transform:translateY(-1px); }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.btn-secondary {
  background:var(--surface); color:var(--text); border:1px solid var(--border);
  border-radius:50px; padding:10px 22px; font-weight:600; font-size:0.9rem;
  cursor:pointer; transition: all var(--transition);
}
.btn-secondary:hover { background:var(--surface-hover); }
.btn-sm { padding:5px 12px; font-size:0.8rem; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; transition:all var(--transition); }
.btn-sm:hover { background:var(--surface-hover); }
.btn-outline { background:transparent; border:1px dashed var(--border); color:var(--text-secondary); width:100%; margin-top:8px; }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-explain { padding:12px 32px; width:100%; font-size:1rem; }
	.usage-counter { text-align:center; font-size:0.76rem; color:var(--text-secondary); margin-top:8px; }
	.usage-counter .remaining { font-weight:600; color:var(--accent); }
	.usage-counter .upgrade-link { color:var(--accent); text-decoration:underline; cursor:pointer; font-weight:600; }
	.step-hint { display:none; text-align:center; padding:10px 14px; margin-top:12px; border-radius:8px; background:var(--accent-light); border:1px solid var(--accent-border); font-size:0.82rem; color:var(--accent); }
	.step-hint.show { display:block; }

/* === Text Input === */
.text-input {
  width:100%; min-height:180px; padding:16px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:0.9rem; line-height:1.7; resize:vertical;
  font-family: inherit; transition: all var(--transition);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.text-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-light); }
.text-input::placeholder { color:var(--text-secondary); }
.input-meta { font-size:0.78rem; color:var(--text-secondary); margin-top:6px; min-height:20px; }

/* === Paragraphs === */
.paragraphs-container { margin-top:16px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
.para-item {
  padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); cursor:pointer; font-size:0.88rem; line-height:1.6;
  transition: all var(--transition); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.para-item:hover { border-color:var(--accent-border); }
.para-item.selected { border-color:var(--accent); background:var(--accent-light); }
.para-item .para-num { font-weight:700; font-size:0.75rem; color:var(--accent); margin-right:6px; }

/* === Action Bar === */
.action-bar {
  margin-top:16px; padding:16px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--surface);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.difficulty-selector { display:flex; gap:4px; margin-bottom:12px; background:var(--bg); border-radius:8px; padding:4px; }
.diff-btn { flex:1; padding:8px 6px; border:none; border-radius:6px; background:transparent; cursor:pointer; font-size:0.8rem; color:var(--text-secondary); transition:all var(--transition); }
.diff-btn.active { background:var(--accent); color:#05262f; }

/* === Output Area === */
.output-area { flex:1; padding:20px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-height:400px; display:flex; flex-direction:column; }
.output-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-secondary); font-size:0.95rem; gap:6px; }
.output-loading { display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; flex:1; }
.spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.output-content { display:none; flex-direction:column; gap:16px; }
.output-section { padding:16px; border-radius:var(--radius-sm); background:var(--bg); position:relative; }
.output-section h3 { font-size:0.9rem; margin-bottom:6px; }
.output-section p { font-size:0.88rem; line-height:1.7; color:var(--text-secondary); }
.copy-btn {
  position:absolute; top:10px; right:10px;
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:3px 8px; font-size:0.72rem; cursor:pointer; color:var(--text-secondary);
  transition: all var(--transition);
}
.copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.output-actions { display:flex; gap:8px; margin-top:8px; }
.feedback-row { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:0.85rem; color:var(--text-secondary); }
.feedback-row button { background:var(--surface); border:1px solid var(--border); border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:1rem; transition:all var(--transition); }
.feedback-row button:hover { border-color:var(--accent); }
	.feedback-input { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:0.78rem; color:var(--text); font-family:inherit; width:160px; margin-left:4px; }

/* === Onboarding === */
.onboard-overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
.onboard-overlay.show { display:flex; }
.onboard-card { background:var(--bg); border-radius:var(--radius); padding:32px; max-width:420px; width:90%; text-align:center; box-shadow:0 24px 64px rgba(0,0,0,0.3); }
.onboard-steps { display:flex; flex-direction:column; gap:10px; margin:20px 0; text-align:left; }
.onboard-step { display:flex; align-items:center; gap:10px; font-size:0.9rem; opacity:0.4; }
.onboard-step.active { opacity:1; }
.step-num { background:var(--accent); color:#05262f; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:700; }

/* === Settings Modal === */
.modal-overlay { display:none; position:fixed; inset:0; z-index:150; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-card { background:var(--bg); border-radius:var(--radius); padding:24px; max-width:480px; width:90%; box-shadow:0 24px 64px rgba(0,0,0,0.3); }
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.close-btn { background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-secondary); }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:4px; }
.form-group select, .form-group input[type="password"], .form-group input[type="text"] {
  width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:0.9rem; font-family:inherit;
}
.key-row { display:flex; gap:8px; }
.key-row input { flex:1; }
.form-hint { font-size:0.78rem; margin-top:4px; }
.form-hint.success { color:#34c759; }
.form-hint.error { color:#ff3b30; }
.save-toast { display:none; font-size:0.82rem; color:#34c759; margin-left:10px; }
.save-toast.show { display:inline; }
#providerInfo { font-size:0.82rem; color:var(--text-secondary); padding:8px 12px; border-radius:8px; background:var(--bg-alt); }
	.custom-warning { font-size:0.76rem; color:var(--text-secondary); padding:8px 12px; border-radius:6px; background:var(--bg-alt); border:1px solid var(--border); margin-top:8px; }

/* === Footer === */
.footer { text-align:center; padding:20px; color:var(--text-secondary); font-size:0.78rem; }

/* === Responsive === */
@media (max-width: 768px) {
	  .lang-group { display:none; }
	  .lang-select { display:inline-block; }
  .main-container { flex-direction:column; padding:8px; }
  .panel { flex:none; }
  .text-input { min-height:140px; }
  .output-area { min-height:300px; }
  .diff-btn { font-size:0.72rem; padding:8px 4px; }
  .difficulty-selector { gap:2px; padding:2px; }
}
  </style>
</head>
<body>

<!-- Onboarding Overlay -->
<div class="welcome-toast" id="welcomeToast"></div>

	<!-- Onboarding Overlay -->
	<div class="onboard-overlay" id="onboardOverlay">
  <div class="onboard-card">
    <h2 id="onboardTitle" data-en="Welcome! 3 Steps 👋" data-zh="歡迎！三步開始 👋" data-zh-cn="欢迎！三步开始 👋">歡迎！三步開始 👋</h2>
    <div class="onboard-steps">
      <div class="onboard-step active" data-step="1">
        <span class="step-num">1</span>
        <span data-en="Set up API Key (pick AI + enter key)" data-zh="設定 API Key（揀 AI + 入 key）" data-zh-cn="设置 API Key（选 AI + 输入 key）">設定 API Key（揀 AI + 入 key）</span>
      </div>
      <div class="onboard-step" data-step="2">
        <span class="step-num">2</span>
        <span data-en="Paste text (content you want to understand)" data-zh="貼文字（貼你想理解嘅內容）" data-zh-cn="贴文字（贴你想理解的内容）">貼文字（貼你想理解嘅內容）</span>
      </div>
      <div class="onboard-step" data-step="3">
        <span class="step-num">3</span>
        <span data-en="Choose difficulty → Explain" data-zh="揀難度 → 解讀" data-zh-cn="选难度 → 解读">揀難度 → 解讀</span>
      </div>
    </div>
    <button class="btn-primary" id="onboardNext" data-en="Start →" data-zh="開始 →" data-zh-cn="开始 →">開始 →</button>
  </div>
</div>

<!-- Nav -->
<nav class="nav-bar">
  <div class="nav-inner">
    <span class="nav-logo" id="navLogo"><img src="icon128.png" class="nav-icon" alt=""> <span data-en="MakeItSimple" data-zh="講人話" data-zh-cn="讲人话">講人話</span></span>
    <div class="nav-actions">
      <a href="pdf.html" class="lang-btn" title="上載 PDF 解釋" data-en-title="Upload PDF to explain" data-zh-title="上載 PDF 解釋" data-zh-cn-title="上传 PDF 解释" style="text-decoration:none;">📄 PDF</a>
	      <button class="icon-btn" id="settingsBtn" title="API 設定" data-en-title="Settings" data-zh-title="API 設定" data-zh-cn-title="API 设置">⚙️</button>
      <span class="lang-group" id="langGroup"><button class="lang-btn" id="langZh" title="廣東話">粵語</button>
	      <button class="lang-btn active" id="langEn" title="English">English</button>
	      <button class="lang-btn" id="langCn" title="普通話">普通話</button></span><select class="lang-select" id="langSelect" style="display:none;"><option value="zh">粵語</option><option value="en">English</option><option value="zh-cn">普通話</option></select><span class="lang-tooltip" id="langTooltip">已根據瀏覽器語言自動選擇</span>
      <button class="icon-btn" id="themeToggle" title="深淺色切換" data-en-title="Dark/Light" data-zh-title="深淺色切換" data-zh-cn-title="深浅色切换">🌙</button>
    </div>
  </div>
</nav>

<!-- API Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 data-en="⚙️ API Settings" data-zh="⚙️ API 設定" data-zh-cn="⚙️ API 设置">⚙️ API 設定</h3>
      <button class="close-btn" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label data-en="AI Engine" data-zh="AI 引擎" data-zh-cn="AI 引擎">AI 引擎</label>
        <select id="providerSelect"></select>
      </div>
      <div class="form-group" id="providerInfo"></div>
	      <div class="form-group" id="customFields" style="display:none;">
	        <label data-en="API Endpoint URL" data-zh="API 網址" data-zh-cn="API 网址">API 網址</label>
	        <input type="text" id="customEndpoint" placeholder="https://api.example.com/v1/chat/completions" data-en-placeholder="https://api.example.com/v1/chat/completions" data-zh-placeholder="https://api.example.com/v1/chat/completions" data-zh-cn-placeholder="https://api.example.com/v1/chat/completions">
	        <label style="margin-top:8px;" data-en="Model Name" data-zh="模型名稱" data-zh-cn="模型名称">模型名稱</label>
	        <input type="text" id="customModel" placeholder="gpt-3.5-turbo" data-en-placeholder="gpt-3.5-turbo" data-zh-placeholder="gpt-3.5-turbo" data-zh-cn-placeholder="gpt-3.5-turbo">
	        <p class="custom-warning" data-en="Your API key and content will be forwarded through this local server to your endpoint above. Only use endpoints you trust." data-zh="你嘅 API Key 同內容會經呢個本機伺服器轉發去你指定嘅 endpoint，請只使用可信任嘅服務。" data-zh-cn="你的 API Key 和内容会经过这个本机服务器转发到你指定的 endpoint，请只使用可信任的服务。">你嘅 API Key 同內容會經呢個本機伺服器轉發去你指定嘅 endpoint，請只使用可信任嘅服務。</p>
	      </div>
      <div class="form-group">
        <label>API Key</label>
        <div class="key-row">
          <input type="password" id="apiKeyInput" placeholder="貼上你嘅 API key..." data-en-placeholder="Paste your API key..." data-zh-placeholder="貼上你嘅 API key..." data-zh-cn-placeholder="贴上你的 API key...">
          <button class="btn-secondary btn-sm" id="testConnBtn" data-en="Test Connection" data-zh="測試連線" data-zh-cn="测试连接">測試連線</button>
        </div>
        <span class="form-hint" id="testResult"></span>
      </div>
      <div class="form-group">
        <button class="btn-primary" id="saveConfigBtn" data-en="Save Settings" data-zh="儲存設定" data-zh-cn="保存设置">儲存設定</button>
        <span class="save-toast" id="saveToast" data-en="Saved ✅" data-zh="已儲存 ✅" data-zh-cn="已保存 ✅">已儲存 ✅</span>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<main class="main-container">

  <!-- Left Column -->
  <section class="panel panel-left">
    <div class="panel-header">
      <h2 data-en="📝 Original Text" data-zh="📝 原文" data-zh-cn="📝 原文">📝 原文</h2>
      <div class="panel-header-actions">
        <button class="btn-sm" id="pasteBtn" data-en="📎 Paste" data-zh="📎 貼上" data-zh-cn="📎 粘贴">📎 貼上</button>
        <button class="btn-sm" id="clearBtn" data-en="🗑 Clear" data-zh="🗑 清除" data-zh-cn="🗑 清除">🗑 清除</button>
      </div>
    </div>
    <textarea id="textInput" class="text-input" placeholder="喺度貼你想理解嘅文字..." data-en-placeholder="Paste the text you want to understand..." data-zh-placeholder="喺度貼你想理解嘅文字..." data-zh-cn-placeholder="在这里贴你想理解的文字..."></textarea>
    <div class="input-meta" id="inputMeta"></div>
    <button class="btn-sm btn-outline" id="sampleBtn" data-en="💡 Try Sample Text" data-zh="💡 試下範例文字" data-zh-cn="💡 试试示例文字">💡 試下範例文字</button>

    <div class="step-hint" id="stepHint"></div>

	    <div class="paragraphs-container" id="paragraphsContainer"></div>

    <div class="action-bar" id="actionBar">
      <div class="difficulty-selector" id="difficultySelector">
        <button class="diff-btn" data-level="elementary" data-en="🎒 Kid" data-zh="🎒 小學" data-zh-cn="🎒 小学">🎒 小學</button>
        <button class="diff-btn active" data-level="secondary" data-en="🎓 Teen" data-zh="🎓 中學" data-zh-cn="🎓 中学">🎓 中學</button>
        <button class="diff-btn" data-level="working-adult" data-en="💼 Working Adult" data-zh="💼 上班" data-zh-cn="💼 上班族">💼 上班</button>
      </div>
      <button class="btn-primary btn-explain" id="explainBtn" disabled data-en="🔍 Explain Selected Paragraph" data-zh="🔍 解讀選中嘅段落" data-zh-cn="🔍 解读选中的段落">🔍 解讀選中嘅段落</button>
	      <div class="usage-counter" id="usageCounter"></div>
    </div>
  </section>

  <!-- Right Column -->
  <section class="panel panel-right">
    <div class="panel-header">
      <h2 data-en="✨ Plain Explanation" data-zh="✨ 用人話解讀" data-zh-cn="✨ 用人话解读">✨ 用人話解讀</h2>
    </div>
    <div class="output-area" id="outputArea">
      <div class="output-placeholder" id="outputPlaceholder">
        <p data-en="👈 Paste text on the left," data-zh="👈 喺左邊貼文字，" data-zh-cn="👈 在左边贴文字，">👈 喺左邊貼文字，</p>
        <p data-en="select a paragraph," data-zh="選擇段落，" data-zh-cn="选择段落，">選擇段落，</p>
        <p data-en="then click Explain" data-zh="然後按「解讀」" data-zh-cn="然后按「解读」">然後按「解讀」</p>
      </div>
      <div class="output-loading" id="outputLoading">
        <div class="spinner"></div>
        <p id="loadingText">AI 正在用白話幫你翻譯緊...</p>
      </div>
      <div class="output-content" id="outputContent"></div>
    </div>
  </section>

</main>

<script>
// === State ===
var state = {
  customEndpoint: '',
  customModel: '',
  provider: 'deepseek',
  apiKey: '',
  difficulty: 'secondary',
  selectedParagraph: -1,
  paragraphs: [],
  configured: false,
  language: 'zh'
};

// === DOM Refs ===
var $ = function(id) { return document.getElementById(id); };
var textInput = $('textInput');
var paragraphsContainer = $('paragraphsContainer');
var inputMeta = $('inputMeta');
var explainBtn = $('explainBtn');
var outputPlaceholder = $('outputPlaceholder');
var outputLoading = $('outputLoading');
var outputContent = $('outputContent');
var settingsModal = $('settingsModal');
var onboardOverlay = $('onboardOverlay');
var providerSelect = $('providerSelect');
var providerInfo = $('providerInfo');
var customFields = $('customFields');
var customEndpoint = $('customEndpoint');
var customModel = $('customModel');
var apiKeyInput = $('apiKeyInput');
var testResult = $('testResult');
var saveToast = $('saveToast');
var loadingText = $('loadingText');
var usageCounter = $('usageCounter');
var stepHint = $('stepHint');

// === Init ===
// === Usage Tracking ===
var DAILY_LIMIT = 10;

function getToday() { return new Date().toISOString().slice(0, 10); }

function getUsage() {
  var data = localStorage.getItem('ez-usage');
  if (!data) return { date: getToday(), count: 0 };
  try { return JSON.parse(data); } catch(e) { return { date: getToday(), count: 0 }; }
}

function saveUsage(data) { localStorage.setItem('ez-usage', JSON.stringify(data)); }

function getRemaining() {
  var u = getUsage();
  if (u.date !== getToday()) { u = { date: getToday(), count: 0 }; saveUsage(u); }
  return DAILY_LIMIT - u.count;
}

function useOne() {
  var u = getUsage();
  if (u.date !== getToday()) { u = { date: getToday(), count: 0 }; }
  u.count++;
  saveUsage(u);
  updateUsageUI();
}

function updateUsageUI() {
  var remaining = getRemaining();
  var isEn = state.language === 'en';
  var isCn = state.language === 'zh-cn';
  if (remaining <= 0) {
    usageCounter.innerHTML = (isEn ? 'No uses left today. <span class="upgrade-link" onclick="window.open(\'https://chowkl.gumroad.com/l/MakeItSimple\',\'_blank\')">Upgrade to Pro →</span>' : (isCn ? '今天次数用完了。<span class="upgrade-link" onclick="window.open(\'https://chowkl.gumroad.com/l/MakeItSimple\',\'_blank\')">升级到 Pro →</span>' : '今日次數用完了。<span class="upgrade-link" onclick="window.open(\'https://chowkl.gumroad.com/l/MakeItSimple\',\'_blank\')">升級到 Pro →</span>'));
    explainBtn.disabled = true;
  } else {
    usageCounter.innerHTML = (isEn ? '<span class="remaining">' + remaining + '</span>/' + DAILY_LIMIT + ' uses left today' : (isCn ? '今日剩余 <span class="remaining">' + remaining + '</span>/' + DAILY_LIMIT + ' 次' : '今日剩餘 <span class="remaining">' + remaining + '</span>/' + DAILY_LIMIT + ' 次'));
  }
}

function init() {
  loadConfigFromServer();
  updateUsageUI();
  loadProviders();
  textInput.addEventListener('input', onTextInput);
  $('pasteBtn').addEventListener('click', pasteFromClipboard);
  $('clearBtn').addEventListener('click', clearAll);
  $('sampleBtn').addEventListener('click', loadSample);
  $('explainBtn').addEventListener('click', doExplain);
  $('settingsBtn').addEventListener('click', function() { settingsModal.classList.add('show'); });
  $('closeSettings').addEventListener('click', function() { settingsModal.classList.remove('show'); });
  $('testConnBtn').addEventListener('click', testConnection);
  $('saveConfigBtn').addEventListener('click', saveConfig);
  $('themeToggle').addEventListener('click', toggleTheme);
  $('langZh').addEventListener('click', function() { setLanguage('zh'); });
	  $('langEn').addEventListener('click', function() { setLanguage('en'); });
	  $('langCn').addEventListener('click', function() { setLanguage('zh-cn'); });
	  $('langSelect').addEventListener('change', function() { setLanguage(this.value); });
  $('onboardNext').addEventListener('click', onboardNext);
  providerSelect.addEventListener('change', onProviderChange);
  document.querySelectorAll('.diff-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.diff-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.difficulty = btn.dataset.level;
    });
  });
  initTheme();
  initLanguage();
}

// === Config ===
function loadConfigFromServer() {
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(c) {
    if (c.configured) {
      state.provider = c.provider;
      state.apiKey = '';
      var saved = localStorage.getItem('ez-api-key');
      if (saved) state.apiKey = saved;
      var savedCE = localStorage.getItem('ez-custom-endpoint');
      if (savedCE) state.customEndpoint = savedCE;
      var savedCM = localStorage.getItem('ez-custom-model');
      if (savedCM) state.customModel = savedCM;
      if (c.customEndpoint) customEndpoint.value = c.customEndpoint;
      if (c.customModel) customModel.value = c.customModel;
      state.configured = true;
      providerSelect.value = c.provider;
      if (c.provider === 'custom') { customFields.style.display = 'block'; }
      updateProviderInfo();
      $('onboardOverlay').classList.remove('show');
    } else {
      $('onboardOverlay').classList.add('show');
    }
  });
}

function saveConfig() {
  var provider = providerSelect.value;
  var ce = customEndpoint.value.trim();
  var cm = customModel.value.trim();
  var apiKey = apiKeyInput.value.trim();
  if (!apiKey) return;
  state.provider = provider;
  state.apiKey = apiKey;
  state.customEndpoint = ce;
  state.customModel = cm;
  localStorage.setItem('ez-custom-endpoint', ce);
  localStorage.setItem('ez-custom-model', cm);
  state.configured = true;
  localStorage.setItem('ez-api-key', apiKey);
  fetch('/api/config', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({provider:provider, apiKey:apiKey, customEndpoint:ce, customModel:cm})
  }).then(function(r) { return r.json(); }).then(function() {
    saveToast.classList.add('show');
    setTimeout(function() { saveToast.classList.remove('show'); settingsModal.classList.remove('show'); }, 1200);
  });
}

function loadProviders() {
  fetch('/api/providers').then(function(r) { return r.json(); }).then(function(providers) {
    providerSelect.innerHTML = '';
    providers.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name + ' — ' + ((state.language === 'en' && p.descEn) ? p.descEn : (state.language === 'zh-cn' && p.descCn) ? p.descCn : p.desc);
      providerSelect.appendChild(opt);
    });
    if (state.provider) { providerSelect.value = state.provider; updateProviderInfo(); }
  });
}

function refreshProviderOptions() {
  fetch('/api/providers').then(function(r) { return r.json(); }).then(function(providers) {
    providers.forEach(function(p) {
      var opt = providerSelect.querySelector('option[value="' + p.id + '"]');
      if (opt) opt.textContent = p.name + ' — ' + ((state.language === 'en' && p.descEn) ? p.descEn : (state.language === 'zh-cn' && p.descCn) ? p.descCn : p.desc);
    });
  });
}

function onProviderChange() {
  state.provider = providerSelect.value;
  if (state.provider === 'custom') { customFields.style.display = 'block'; } else { customFields.style.display = 'none'; }
  updateProviderInfo();
  if (textInput.value.trim()) updateMeta();
}

function updateProviderInfo() {
  fetch('/api/providers').then(function(r) { return r.json(); }).then(function(providers) {
    var p = providers.find(function(x) { return x.id === providerSelect.value; });
    if (p) {
      providerInfo.innerHTML = (state.language === 'en' ?
        '💰 Input: $' + p.costPer1MInput + '/1M tokens · Output: $' + p.costPer1MOutput + '/1M tokens · ' + p.currency :
        (state.language === 'zh-cn' ?
          '💰 入: $' + p.costPer1MInput + '/百万 token · 出: $' + p.costPer1MOutput + '/百万 token · ' + p.currency :
          '💰 入: $' + p.costPer1MInput + '/百萬 token · 出: $' + p.costPer1MOutput + '/百萬 token · ' + p.currency));
    }
  });
}

function testConnection() {
  var provider = providerSelect.value;
  var apiKey = apiKeyInput.value.trim();
  if (!apiKey) { testResult.textContent = state.language === 'en' ? 'Please enter API key first' : (state.language === 'zh-cn' ? '请先输入 API key' : '請先輸入 API key'); testResult.className = 'form-hint error'; return; }
  testResult.textContent = state.language === 'en' ? 'Testing...' : (state.language === 'zh-cn' ? '测试中...' : '測試緊...'); testResult.className = 'form-hint';
  fetch('/api/test-connection', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({provider:provider, apiKey:apiKey, customEndpoint:ce, customModel:cm})
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.ok) { testResult.textContent = state.language === 'en' ? 'Connected ✅' : (state.language === 'zh-cn' ? '连接成功 ✅' : '連線成功 ✅'); testResult.className = 'form-hint success'; }
    else if (data.error === 'auth_error') { testResult.textContent = state.language === 'en' ? 'Key seems wrong, double check it～ 🔑' : (state.language === 'zh-cn' ? 'Key 好像有问题，检查一下吧～ 🔑' : 'Key 似乎有問題，檢查下啦～ 🔑'); testResult.className = 'form-hint error'; }
    else { testResult.textContent = (state.language === 'en' ? 'Connection failed: ' : (state.language === 'zh-cn' ? '连接失败：' : '連線失敗：')) + (data.error || 'unknown'); testResult.className = 'form-hint error'; }
  }).catch(function() {
    testResult.textContent = state.language === 'en' ? 'Cannot reach the AI server, check your network 🌐' : (state.language === 'zh-cn' ? '连不上 AI 服务器，检查下网络吧 🌐' : '連唔到去 AI 伺服器，檢查下網絡啦 🌐');
    testResult.className = 'form-hint error';
  });
}

// === Text Input ===
function onTextInput() {
  var text = textInput.value.trim();
  if (!text) { paragraphsContainer.innerHTML = ''; inputMeta.innerHTML = ''; explainBtn.disabled = true; stepHint.classList.remove('show'); return; }
  state.paragraphs = text.split(/\n\n+/).filter(function(p) { return p.trim(); });
  if (state.selectedParagraph < 0 || state.selectedParagraph >= state.paragraphs.length) {
    state.selectedParagraph = 0;
  }
  renderParagraphs();
  updateMeta();
  updateStepHint();
}

function renderParagraphs() {
  paragraphsContainer.innerHTML = state.paragraphs.map(function(p, i) {
    return '<div class="para-item' + (i === state.selectedParagraph ? ' selected' : '') + '" data-index="' + i + '">' +
      '<span class="para-num">' + (state.language === 'en' ? '¶' : '段') + (i + 1) + '</span>' + escapeHtml(p.slice(0, 200)) + (p.length > 200 ? '...' : '') +
    '</div>';
  }).join('');
  Array.from(paragraphsContainer.children).forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(el.dataset.index);
      state.selectedParagraph = idx;
      renderParagraphs();
      explainBtn.disabled = false;
      updateStepHint();
    });
  });
  explainBtn.disabled = false;
}

function updateStepHint() {
  var isEn = state.language === 'en';
  var isCn = state.language === 'zh-cn';
  var closeBtn = '<span style="cursor:pointer;float:right;opacity:0.6;" onclick="document.getElementById(\'stepHint\').classList.remove(\'show\')">✕</span>';
  if (state.paragraphs.length > 1) {
    stepHint.innerHTML = closeBtn + (isEn ? '👆 Step 1: Click a paragraph above to select it. Step 2: Choose difficulty → Step 3: Click Explain' : (isCn ? '👆 第1步：点选上方段落。第2步：选择难度 → 第3步：点击解读' : '👆 第1步：點選上方段落。第2步：揀難度 → 第3步：解讀'));
  } else {
    stepHint.innerHTML = closeBtn + (isEn ? 'Step 2: Choose difficulty → Step 3: Click Explain below' : (isCn ? '第2步：选择难度 → 第3步：点击下方解读' : '第2步：揀難度 → 第3步：按下面解讀'));
  }
  stepHint.classList.add('show');
}

function updateMeta() {
  var text = textInput.value;
  var chars = text.length;
  var isEn = state.language === 'en';
  var isCn = state.language === 'zh-cn';
  var html = chars + (isEn ? ' chars' : ' 字');
  if (chars > 0 && state.provider) {
    fetch('/api/estimate', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({textLength:chars, provider:state.provider})
    }).then(function(r) { return r.json(); }).then(function(e) {
      inputMeta.innerHTML = chars + (isEn ? ' chars · ~' : (isCn ? ' 字 · 约 ' : ' 字 · 約 ')) + e.inputTokens + ' tokens · ' + (isEn ? 'Est. cost ~$' : (isCn ? '估费用 ~$' : '估費用 ~$')) + e.estimatedUSD.toFixed(4) + ' ' + e.currency;
    });
  } else {
    inputMeta.innerHTML = html;
  }
}

function pasteFromClipboard() {
  navigator.clipboard.readText().then(function(t) {
    textInput.value = t; onTextInput();
  }).catch(function() {
    textInput.focus();
  });
}

function clearAll() {
  textInput.value = '';
  state.paragraphs = []; state.selectedParagraph = -1;
  paragraphsContainer.innerHTML = '';
  inputMeta.innerHTML = '';
  explainBtn.disabled = true;
  outputPlaceholder.style.display = 'flex';
  outputLoading.style.display = 'none';
  outputContent.style.display = 'none';
  stepHint.classList.remove('show');
}

// === Sample Texts ===
var samplesZh = [
  '大型語言模型（Large Language Model, LLM）透過自注意力機制（Self-Attention Mechanism）捕捉長距離語境依賴關係，並利用多層 Transformer 架構進行表徵學習。在預訓練階段，模型以大規模語料庫進行自監督學習，透過預測下一個 Token 的方式逐步最佳化參數。隨後透過指令微調（Instruction Tuning）與 RLHF（Reinforcement Learning from Human Feedback）使模型對齊人類偏好，實現卓越的自然語言理解與生成能力。',

  '量子計算（Quantum Computing）利用量子疊加（Superposition）與量子糾纏（Entanglement）等量子力學基本原理來處理資訊。與傳統計算機使用 0 或 1 的位元不同，量子位元（Qubit）可以同時處於 0 和 1 的疊加態，使量子計算機能夠並行處理極大量的可能性。Shor 演算法展示了量子計算在破解 RSA 加密上的潛在優勢，而 Grover 演算法則能在無序資料庫中實現二次加速搜尋。',

  '區塊鏈技術本質上是一種去中心化的分散式帳本（Distributed Ledger），透過共識機制（Consensus Mechanism）如工作量證明（Proof of Work）或權益證明（Proof of Stake）來確保資料不可篡改性。智能合約（Smart Contract）則是運行在區塊鏈上的自動化程式，當預設條件被觸發時自動執行合約條款。DeFi（去中心化金融）利用這些技術建立無需中介的金融服務生態，包括借貸、交易與流動性挖礦等應用。'
];

var samplesEn = [
  'The transformer architecture revolutionized natural language processing by introducing the self-attention mechanism, which allows each token in a sequence to attend to every other token simultaneously. Unlike recurrent neural networks that process tokens sequentially, transformers process the entire sequence in parallel, enabling training on vastly larger datasets. The multi-head attention mechanism further improves this by allowing the model to focus on different representation subspaces at different positions.',

  'Quantum computing harnesses fundamental principles of quantum mechanics — superposition and entanglement — to process information in ways classical computers cannot. While a classical bit must be either 0 or 1, a quantum bit (qubit) can exist in a superposition of both states simultaneously. This exponential parallelism allows quantum algorithms like Shor\'s algorithm to theoretically break RSA encryption, and Grover\'s algorithm to search unsorted databases with quadratic speedup.',

  'Blockchain technology is fundamentally a decentralized distributed ledger secured by consensus mechanisms such as Proof of Work (PoW) or Proof of Stake (PoS). Each block contains a cryptographic hash of the previous block, creating an immutable chain. Smart contracts are self-executing programs deployed on the blockchain — when predefined conditions are met, the contract automatically executes. Decentralized Finance (DeFi) leverages these primitives to build permissionless financial services including lending, trading, and yield farming.'
];

function loadSample() {
  var samples = state.language === 'en' ? samplesEn : samplesZh;
  var sample = samples[Math.floor(Math.random() * samples.length)];
  textInput.value = sample;
  onTextInput();
}

// === Explain ===
var explainCooldown = false;

function doExplain() {
  if (explainCooldown) return;
  if (!state.configured || !state.apiKey) {
    settingsModal.classList.add('show'); return;
  }
  if (state.selectedParagraph < 0 || state.selectedParagraph >= state.paragraphs.length) {
    outputPlaceholder.style.display = 'none';
    outputLoading.style.display = 'none';
    outputContent.style.display = 'flex';
    outputContent.innerHTML = '<div class="output-section"><p style="text-align:center;">' + (state.language === 'en' ? '👆 Please select a paragraph on the left first!' : (state.language === 'zh-cn' ? '👆 请先在左边选择一个段落！' : '👆 請喺左邊揀一個段落先！')) + '</p></div>';
    return;
  }
  // Check daily limit
  if (getRemaining() <= 0) {
    outputPlaceholder.style.display = 'none';
    outputLoading.style.display = 'none';
    outputContent.style.display = 'flex';
    outputContent.innerHTML = '<div class="output-section"><p style="text-align:center;">' + (state.language === 'en' ? 'Daily limit reached.<br><a href="https://chowkl.gumroad.com/l/MakeItSimple" target="_blank" style="color:var(--accent);font-weight:600;">Upgrade to Pro →</a>' : (state.language === 'zh-cn' ? '今日次数已用完。<br><a href="https://chowkl.gumroad.com/l/MakeItSimple" target="_blank" style="color:var(--accent);font-weight:600;">升级到 Pro →</a>' : '今日次數已用完。<br><a href="https://chowkl.gumroad.com/l/MakeItSimple" target="_blank" style="color:var(--accent);font-weight:600;">升級到 Pro →</a>')) + '</p></div>';
    updateUsageUI();
    return;
  }

  var text = state.paragraphs[state.selectedParagraph];
  explainCooldown = true;
  stepHint.classList.remove('show');
  setTimeout(function() { explainCooldown = false; }, 2000);

  // Show loading
  outputPlaceholder.style.display = 'none';
  outputContent.style.display = 'none';
  outputLoading.style.display = 'flex';
  var diffTextsZh = { elementary: 'AI 老師而家用故事書方式講緊畀你聽哦～ 📖', secondary: 'AI 正在用白話幫你翻譯緊...', 'working-adult': 'AI 顧問幫你分析緊重點... 💼' };
  var diffTextsCn = { elementary: 'AI 老师正在用讲故事的方式讲给你听哦～ 📖', secondary: 'AI 正在用白话帮你翻译中...', 'working-adult': 'AI 顾问正在帮你分析重点... 💼' };
  var diffTextsEn = { elementary: 'AI teacher is explaining to you with a story～ 📖', secondary: 'AI is translating into plain language...', 'working-adult': 'AI is analyzing the key points for you... 💼' };
  var diffTexts = state.language === 'en' ? diffTextsEn : (state.language === 'zh-cn' ? diffTextsCn : diffTextsZh);
  loadingText.textContent = diffTexts[state.difficulty] || (state.language === 'en' ? 'AI is translating into plain language...' : (state.language === 'zh-cn' ? 'AI 正在用白话帮你翻译中...' : 'AI 正在用白話幫你翻譯緊...'));

  fetch('/api/explain', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      text: text, difficulty: state.difficulty,
      provider: state.provider, apiKey: state.apiKey,
      language: state.language
    })
  }).then(function(r) { return r.json(); }).then(function(data) {
    outputLoading.style.display = 'none';
    if (data.error) {
      showError(data.error);
    } else {
      showResult(data.result);
        useOne();
    }
  }).catch(function() {
    outputLoading.style.display = 'none';
    showError('unknown');
  });
}

function showError(code) {
  var messagesEn = {
    auth_error: 'API key seems wrong, double check it～ 🔑',
    quota_exceeded: "You've used up your quota! Top up on the platform 💰",
    content_too_long: "This text is too long, try explaining paragraph by paragraph～ 📏",
    unknown: "Something went wrong, try again 🥲"
  };
  var messagesCn = {
    auth_error: 'Key 好像有问题，检查一下吧～ 🔑',
    quota_exceeded: '这个月的用量用完了！去平台充值吧 💰',
    content_too_long: '这篇内容太长了，试试逐段解读～ 📏',
    unknown: '不知道发生了什么，再试一次吧 🥲'
  };
  var messagesZh = {
    auth_error: 'Key 似乎有問題，檢查下啦～ 🔑',
    quota_exceeded: '今個月嘅用量爆咗啦！去平台入錢啦 💰',
    content_too_long: '呢篇嘢太長啦，試下逐段解讀～ 📏',
    unknown: '唔知發生咩事，再試一次啦 🥲'
  };
  var messages = state.language === 'en' ? messagesEn : (state.language === 'zh-cn' ? messagesCn : messagesZh);
  outputContent.innerHTML = '<div class="output-section"><p>' + (messages[code] || messages.unknown) + '</p></div>';
  outputContent.style.display = 'flex';
}

function showResult(text) {
  outputContent.innerHTML = '';

  // Top bar: diff+provider label, char count, regenerate
  var diffLabels = { elementary: state.language === 'en' ? 'Kid' : (state.language === 'zh-cn' ? '小学' : '小學'), secondary: state.language === 'en' ? 'Teen' : (state.language === 'zh-cn' ? '中学' : '中學'), 'working-adult': state.language === 'en' ? 'Work' : (state.language === 'zh-cn' ? '上班' : '上班') };
  var diffEmojis = { elementary: '🎒', secondary: '🎓', 'working-adult': '💼' };
  var topBar = document.createElement('div');
  topBar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px;';
  var leftGroup = document.createElement('span');
  leftGroup.style.cssText = 'display:flex;align-items:center;gap:8px;';
  var diffLabel = document.createElement('span');
  diffLabel.style.cssText = 'font-size:0.72rem;background:var(--accent);color:#05262f;padding:2px 8px;border-radius:4px;font-weight:600;';
  diffLabel.textContent = (diffEmojis[state.difficulty] || '') + ' ' + diffLabels[state.difficulty] + ' · ' + (state.provider === 'deepseek' ? 'DeepSeek' : state.provider === 'openai' ? 'OpenAI' : state.provider === 'claude' ? 'Claude' : state.provider === 'gemini' ? 'Gemini' : 'Custom');
  var charLabel = document.createElement('span');
  charLabel.style.cssText = 'font-size:0.75rem;color:var(--text-secondary);';
  var originalChars = state.paragraphs[state.selectedParagraph] ? state.paragraphs[state.selectedParagraph].length : 0;
  charLabel.textContent = (state.language === 'en' ? 'Original: ' : (state.language === 'zh-cn' ? '原文：' : '原文：')) + originalChars + (state.language === 'en' ? ' chars' : ' 字');
  leftGroup.appendChild(diffLabel);
  leftGroup.appendChild(charLabel);
  var topRegenBtn = document.createElement('button');
  topRegenBtn.className = 'btn-sm';
  topRegenBtn.textContent = state.language === 'en' ? '🔄 Regenerate' : (state.language === 'zh-cn' ? '🔄 重新生成' : '🔄 重新生成');
  topRegenBtn.addEventListener('click', doExplain);
  topBar.appendChild(leftGroup);
  topBar.appendChild(topRegenBtn);
  outputContent.appendChild(topBar);

  var sections = text.split(/\n(?=📌|💬|🧸|✅)/);
  sections.forEach(function(s) {
    s = s.trim();
    if (!s) return;
    var title = s.split('\n')[0];
    var body = s.split('\n').slice(1).join('\n').trim();
    var secDiv = document.createElement('div');
    secDiv.className = 'output-section';
    var h3 = document.createElement('h3');
    h3.textContent = title;
    var p = document.createElement('p');
    p.innerHTML = renderMarkdown(body || title);
    var copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = state.language === 'en' ? 'Copy' : (state.language === 'zh-cn' ? '复制' : '複製');
    copyBtn.addEventListener('click', function() {
      navigator.clipboard.writeText(title + '\n' + body);
      copyBtn.textContent = state.language === 'en' ? 'Copied!' : (state.language === 'zh-cn' ? '已复制!' : '已複製!');
      setTimeout(function() { copyBtn.textContent = state.language === 'en' ? 'Copy' : (state.language === 'zh-cn' ? '复制' : '複製'); }, 1500);
    });
    secDiv.appendChild(h3);
    secDiv.appendChild(p);
    secDiv.appendChild(copyBtn);
    outputContent.appendChild(secDiv);
  });

  // Action buttons
  var actionsDiv = document.createElement('div');
  actionsDiv.className = 'output-actions';
  var copyAllBtn = document.createElement('button');
  copyAllBtn.className = 'btn-secondary';
  copyAllBtn.textContent = state.language === 'en' ? '📋 Copy All' : (state.language === 'zh-cn' ? '📋 复制全部' : '📋 複製全部');
  copyAllBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(text);
    copyAllBtn.textContent = state.language === 'en' ? 'Copied!' : (state.language === 'zh-cn' ? '已复制!' : '已複製!');
    setTimeout(function() { copyAllBtn.textContent = state.language === 'en' ? '📋 Copy All' : (state.language === 'zh-cn' ? '📋 复制全部' : '📋 複製全部'); }, 1500);
  });
  var regenBtn = document.createElement('button');
  regenBtn.className = 'btn-secondary';
  regenBtn.textContent = state.language === 'en' ? '🔄 Regenerate' : (state.language === 'zh-cn' ? '🔄 重新生成' : '🔄 重新生成');
  regenBtn.addEventListener('click', doExplain);

  actionsDiv.appendChild(copyAllBtn);
  actionsDiv.appendChild(regenBtn);
  outputContent.appendChild(actionsDiv);

  // Feedback
  var feedbackDiv = document.createElement('div');
  feedbackDiv.className = 'feedback-row';
  var fbLabel = document.createElement('span');
  fbLabel.textContent = state.language === 'en' ? 'How was this explanation?' : (state.language === 'zh-cn' ? '这个解释怎么样？' : '呢個解釋點樣？');
  var thumbsUp = document.createElement('button');
  thumbsUp.textContent = '👍';
  thumbsUp.addEventListener('click', function() {
    fbLabel.textContent = state.language === 'en' ? 'Thanks! Happy to help 🎉' : (state.language === 'zh-cn' ? '多谢！好开心能帮到你 🎉' : '多謝！好開心幫到你 🎉');
    thumbsUp.disabled = true; thumbsDown.disabled = true;
  });
  var thumbsDown = document.createElement('button');
  thumbsDown.textContent = '👎';
  var feedbackInput = document.createElement('input');
  feedbackInput.type = 'text';
  feedbackInput.className = 'feedback-input';
  feedbackInput.placeholder = state.language === 'en' ? 'What could be better? (optional)' : (state.language === 'zh-cn' ? '哪里可以改进？（选填）' : '邊度可以改進？（選填）');
  feedbackInput.style.display = 'none';
  thumbsDown.addEventListener('click', function() {
    feedbackInput.style.display = 'inline-block';
    feedbackInput.focus();
    fbLabel.textContent = state.language === 'en' ? 'Sorry about that. What went wrong?' : (state.language === 'zh-cn' ? '抱歉。哪里有问题？' : '唔好意思。邊度出咗問題？');
    thumbsUp.disabled = true; thumbsDown.disabled = true;
    // Hide input after 8 seconds
    setTimeout(function() {
      if (feedbackInput.value.trim()) {
        fbLabel.textContent = state.language === 'en' ? 'Thanks for the feedback! 💪' : (state.language === 'zh-cn' ? '多谢反馈！💪' : '多謝反饋！💪');
      }
      feedbackInput.style.display = 'none';
    }, 8000);
  });
  feedbackDiv.appendChild(fbLabel);
  feedbackDiv.appendChild(thumbsUp);
  feedbackDiv.appendChild(thumbsDown);
  feedbackDiv.appendChild(feedbackInput);
  outputContent.appendChild(feedbackDiv);

  // Re-explain with other difficulties
  var reExplainDiv = document.createElement('div');
  reExplainDiv.className = 'output-actions';
  reExplainDiv.style.borderTop = '1px solid var(--border)';
  reExplainDiv.style.paddingTop = '12px';
  var reExplainLabel = document.createElement('span');
  reExplainLabel.style.cssText = 'font-size:0.78rem;color:var(--text-secondary);margin-right:4px;';
  reExplainLabel.textContent = state.language === 'en' ? 'Explain as:' : (state.language === 'zh-cn' ? '用其他难度解释：' : '用其他難度解釋：');
  reExplainDiv.appendChild(reExplainLabel);
  var difficulties = [
    { level: 'elementary', label: state.language === 'en' ? 'Kid' : (state.language === 'zh-cn' ? '小学' : '小學'), emoji: '🎒' },
    { level: 'secondary', label: state.language === 'en' ? 'Teen' : (state.language === 'zh-cn' ? '中学' : '中學'), emoji: '🎓' },
    { level: 'working-adult', label: state.language === 'en' ? 'Work' : (state.language === 'zh-cn' ? '上班' : '上班'), emoji: '💼' }
  ];
  difficulties.forEach(function(d) {
    if (d.level === state.difficulty) return;
    var btn = document.createElement('button');
    btn.className = 'btn-sm';
    btn.textContent = d.emoji + ' ' + d.label;
    btn.addEventListener('click', function() {
      document.querySelectorAll('.diff-btn').forEach(function(b) { b.classList.remove('active'); });
      var targetBtn = document.querySelector('.diff-btn[data-level="' + d.level + '"]');
      if (targetBtn) targetBtn.classList.add('active');
      state.difficulty = d.level;
      doExplain();
    });
    reExplainDiv.appendChild(btn);
  });
  outputContent.appendChild(reExplainDiv);

  outputContent.style.display = 'flex';
}

// === Theme ===
function initTheme() {
  var saved = localStorage.getItem('ez-theme');
  if (saved) { document.documentElement.setAttribute('data-theme', saved); $('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙'; }
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.setAttribute('data-theme', 'dark'); $('themeToggle').textContent = '☀️'; }
}

function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  $('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('ez-theme', next);
}

// === Language ===
function initLanguage() {
  var saved = localStorage.getItem('ez-lang');
  if (saved) {
    state.language = saved;
  } else {
    var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
    if (browserLang.startsWith('zh-hk') || browserLang.startsWith('zh-tw') || browserLang.startsWith('zh-hant')) {
      state.language = 'zh';
    } else if (browserLang.startsWith('zh')) {
      state.language = 'zh-cn';
    } else {
      state.language = 'en';
    }
  }
  if (!saved) {
    setTimeout(function() { $('langTooltip').classList.add('show'); }, 500);
    setTimeout(function() { $('langTooltip').classList.remove('show'); }, 8000);
    // Welcome toast
    var welcomeTexts = { en: 'Welcome to MakeItSimple! Hope this helps you understand complex stuff easily～ 💚', zh: '歡迎嚟到講人話！希望幫到你輕鬆理解複雜內容～ 💚', 'zh-cn': '欢迎来到讲人话！希望帮你轻松理解复杂内容～ 💚' };
    var el = $('welcomeToast');
    el.textContent = welcomeTexts[state.language] || welcomeTexts.zh;
    setTimeout(function() { el.classList.add('show'); }, 800);
    setTimeout(function() { el.classList.remove('show'); }, 6000);
  }
  applyLanguage(state.language);
}

function setLanguage(lang) {
  state.language = lang;
  localStorage.setItem('ez-lang', lang);
  $('langSelect').value = lang;
  $('langTooltip').classList.remove('show');
  applyLanguage(lang);
  // Re-render paragraphs if text exists
  if (textInput.value.trim()) { renderParagraphs(); updateStepHint(); }
}

function applyLanguage(lang) {
  // Highlight the active language button
  document.querySelectorAll('.lang-btn').forEach(function(btn) { btn.classList.remove('active'); });
  if (lang === 'zh') $('langZh').classList.add('active');
  else if (lang === 'zh-cn') $('langCn').classList.add('active');
  else $('langEn').classList.add('active');

  // All elements with data-en
  document.querySelectorAll('[data-en]').forEach(function(el) {
    var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-zh');
    if (text) el.textContent = text;
  });

  // All elements with data-en-placeholder
  document.querySelectorAll('[data-en-placeholder]').forEach(function(el) {
    var ph = lang === 'en' ? el.getAttribute('data-en-placeholder') : el.getAttribute('data-zh-placeholder');
    if (ph) el.placeholder = ph;
  });

  // All elements with data-en-title
  document.querySelectorAll('[data-en-title]').forEach(function(el) {
    var t = lang === 'en' ? el.getAttribute('data-en-title') : el.getAttribute('data-zh-title');
    if (t) el.title = t;
  });

  // All elements with data-zh-cn
  if (lang === 'zh-cn') {
    document.querySelectorAll('[data-zh-cn]').forEach(function(el) {
      var text = el.getAttribute('data-zh-cn');
      if (text) el.textContent = text;
    });
    document.querySelectorAll('[data-zh-cn-placeholder]').forEach(function(el) {
      var ph = el.getAttribute('data-zh-cn-placeholder');
      if (ph) el.placeholder = ph;
    });
    document.querySelectorAll('[data-zh-cn-title]').forEach(function(el) {
      var t = el.getAttribute('data-zh-cn-title');
      if (t) el.title = t;
    });
  }

  // Update page title
  document.title = lang === 'en' ? 'MakeItSimple — Complex text, simple words' : (lang === 'zh-cn' ? '讲人话 — 复杂文章变简单白话' : '講人話 — 複雜文章變簡單白話');

  // Refresh dynamic text
  if (textInput.value.trim()) updateMeta();
  updateProviderInfo();
  refreshProviderOptions();
  updateUsageUI();
}

// === Onboarding ===
var onboardStep = 0;
var onboardSteps = [
  function() {
    settingsModal.classList.add('show');
    $('onboardTitle').textContent = state.language === 'en' ? 'Step 1/3: Set up API Key' : (state.language === 'zh-cn' ? '步骤 1/3：设置 API Key' : '步驟 1/3：設定 API Key');
  },
  function() {
    settingsModal.classList.remove('show');
    $('onboardTitle').textContent = state.language === 'en' ? 'Step 2/3: Paste Text' : (state.language === 'zh-cn' ? '步骤 2/3：贴文字' : '步驟 2/3：貼文字');
  },
  function() {
    $('onboardTitle').textContent = state.language === 'en' ? 'Step 3/3: Difficulty → Explain' : (state.language === 'zh-cn' ? '步骤 3/3：选难度 → 解读' : '步驟 3/3：揀難度 → 解讀');
  }
];

function onboardNext() {
  onboardStep++;
  var steps = document.querySelectorAll('.onboard-step');
  steps.forEach(function(s, i) { s.classList.toggle('active', i === onboardStep); });
  if (onboardStep >= 3) {
    $('onboardOverlay').classList.remove('show');
    if (!state.configured) settingsModal.classList.add('show');
  } else {
    onboardSteps[onboardStep]();
  }
}

// === Helpers ===
function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMarkdown(text) {
  var html = escapeHtml(text);
  // Bold: **text**
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Unordered list: lines starting with - * •
  html = html.replace(/(^|\n)([-•*]) (.+)/g, '$1<li>$3</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(m) {
    // Wrap consecutive <li> in <ul> if not already wrapped
    if (m.indexOf('<ul>') === -1 && m.indexOf('<ol>') === -1) return '<ul>' + m + '</ul>';
    return m;
  });
  // Line breaks: double newline = paragraph break
  html = html.replace(/\n\n/g, '<br><br>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// === Start ===
init();
</script>
